name: CI

# Unit tests need no database, network or secrets, so they gate every push.
# Smoke tests need a live project and Gemini keys, so they're run by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser tooling
        run: npm ci

      - name: Install ingestion dependencies used by the tests
        run: npm ci --prefix ingest

      - name: Unit tests
        run: npm test

      - name: Parse check (browser modules and edge functions)
        run: npm run check

      - name: Syntax-check the ingestion CLI
        run: |
          set -e
          for f in $(find ingest -type f \( -name '*.js' -o -name '*.mjs' \) -not -path '*/node_modules/*'); do
            node --check "$f"
          done

      - name: Type-check the edge functions
        # --node-modules-dir=auto lets Deno resolve supabase-js's npm deps itself.
        run: |
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$HOME/.deno" sh -s v2.9.7
          export PATH="$HOME/.deno/bin:$PATH"
          deno check --node-modules-dir=auto supabase/functions/*/index.ts
