<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markwise: Edexcel International GCSE study assistant</title>
  <meta name="description"
    content="Track your homework, and get answers and marking from the real Pearson Edexcel International GCSE (IGCSE) past papers and mark schemes.">
  <meta name="color-scheme" content="light dark">

  <meta property="og:title" content="Markwise">
  <meta property="og:description"
    content="The Edexcel International GCSE assistant that has actually read the papers: grounded answers, real marking, and a planner that knows when the work lands.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="src/assets/markwise-mark.svg">
  <meta name="twitter:card" content="summary">

  <script>
    /* Apply the stored theme before first paint so there is no flash. */
    try {
      document.documentElement.setAttribute("data-theme", localStorage.getItem("markwise-theme") || "system");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "system");
    }
  </script>

  <link rel="stylesheet" href="src/css/app.css">
  <link rel="stylesheet" href="src/css/chat.css">
  <link rel="stylesheet" href="src/css/workspace.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="src/assets/markwise-icon.svg">
  <link rel="apple-touch-icon" href="src/assets/markwise-icon.svg">
  <meta name="theme-color" content="#2563d9">

</head>

<body>

  <a class="skip-link" href="#outlet">Skip to content</a>

  <div class="auth-screen" id="authScreen" hidden></div>
  <div class="auth-screen" id="recoveryScreen" hidden></div>
  <div class="auth-screen" id="onboardScreen" hidden></div>

  <div class="app-shell" id="appShell" hidden>

    <nav class="sidebar" aria-label="Main">
      <div class="brand-mark">
        <img class="brand-glyph" src="src/assets/markwise-icon.svg" alt="" width="26" height="26">
        <span class="brand-name">Mark<span>wise</span></span>
      </div>

      <button class="nav-link" data-nav="planner">
        <span class="nav-glyph" aria-hidden="true"></span> Planner
        <span class="nav-key" aria-hidden="true">P</span>
      </button>
      <button class="nav-link" data-nav="calendar">
        <span class="nav-glyph" aria-hidden="true"></span> Calendar
        <span class="nav-key" aria-hidden="true">C</span>
      </button>
      <button class="nav-link" data-nav="assistant">
        <span class="nav-glyph" aria-hidden="true"></span> Assistant
        <span class="nav-key" aria-hidden="true">A</span>
      </button>
      <button class="nav-link" data-nav="mock">
        <span class="nav-glyph" aria-hidden="true"></span> Mock exams
        <span class="nav-key" aria-hidden="true">M</span>
      </button>
      <button class="nav-link" data-nav="markpaper">
        <span class="nav-glyph" aria-hidden="true"></span> Mark a paper
        <span class="nav-key" aria-hidden="true">K</span>
      </button>

      <p class="nav-section">Practise</p>
      <button class="nav-link" data-nav="recall">
        <span class="nav-glyph" aria-hidden="true"></span> Recall
        <span class="nav-key" aria-hidden="true">R</span>
      </button>
      <button class="nav-link" data-nav="library">
        <span class="nav-glyph" aria-hidden="true"></span> Library
        <span class="nav-key" aria-hidden="true">L</span>
      </button>

      <div class="sidebar-foot">
        <button class="nav-link subtle" data-nav="progress">
          <span class="nav-glyph" aria-hidden="true"></span> Progress
          <span class="nav-key" aria-hidden="true">G</span>
        </button>
        <button class="nav-link subtle" data-nav="settings">
          <span class="nav-glyph" aria-hidden="true"></span> Settings
        </button>
        <span class="user-email" id="userEmail"></span>
        <button class="nav-link subtle" id="signOut">
          <span class="nav-glyph" aria-hidden="true"></span> Sign out
        </button>
      </div>
    </nav>

    <div class="app-main">
      <div class="topbar">
        <button class="icon-btn" id="navToggle" aria-label="Menu" aria-expanded="false" aria-controls="appShell">☰</button>
        <span class="brand-name">Markwise</span>
      </div>
      <main class="main" id="outlet" tabindex="-1"></main>
    </div>
  </div>

  <div class="overlay" id="modalOverlay" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="src/js/app.js"></script>

  <noscript>
    <div class="auth-screen">
      <div class="auth-card">
        <h1>JavaScript required</h1>
        <p class="auth-sub">Markwise needs JavaScript to load your work.</p>
      </div>
    </div>
  </noscript>
</body>

</html>
